<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#101827">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Mis Finanzas">

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <link rel="stylesheet" href="style.css">

  <title>Mis Finanzas Dou</title>
</head>

<body>

  <header class="topbar">
    <div>
      <p class="eyebrow">CONTROL PERSONAL</p>
      <h1>Mis Finanzas <span>Dou</span></h1>
    </div>

    <button
      id="quickBackup"
      class="icon-btn"
      aria-label="Respaldar">
      ↥
    </button>
  </header>

  <main>

    <section class="month-strip">
      <button id="prevMonth" class="month-arrow">‹</button>

      <div class="month-center">
        <label for="monthSelect">MES ACTIVO</label>
        <select id="monthSelect"></select>
      </div>

      <button id="nextMonth" class="month-arrow">›</button>
    </section>

    <nav class="tabs">
      <button class="tab active" data-tab="summary">
        Resumen
      </button>

      <button class="tab" data-tab="income">
        Ingresos
      </button>

      <button class="tab" data-tab="tips">
        Propinas
      </button>

      <button class="tab" data-tab="expenses">
        Gastos
      </button>

      <button class="tab" data-tab="savings">
        Ahorros
      </button>

      <button class="tab" data-tab="stats">
        Estadísticas
      </button>
    </nav>

    <section id="view" aria-live="polite"></section>

  </main>

  <footer class="footer">
    <span id="saveStatus">
      Guardado en este iPhone
    </span>

    <button id="backupInfo" class="text-btn">
      Respaldos
    </button>
  </footer>

  <input
    id="importFile"
    type="file"
    accept="application/json,.json"
    hidden
  >

  <script src="script.js"></script>

</body>
</html>
